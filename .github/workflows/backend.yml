name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - "**"

  pull_request_target:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  preflight:
    name: 🚦 Preflight
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "EVENT    = ${{ github.event_name }}"
          echo "REF      = ${{ github.ref }}"
          echo "PR HEAD  = ${{ github.event.pull_request.head.ref }}"
          echo "-------------------------"

  pr-check:
    name: 🧪 PR Check (Lint & Test)
    needs: preflight
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'push') && (
        github.ref != 'refs/heads/main' ||
        github.ref != 'refs/heads/staging'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Pretend we're running tests here..."
  build-push:
    name: 🏗️ Build & Push Docker
    runs-on: ubuntu-latest
    needs: [pr-check]

    if: |
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'push')

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false
            prefix=
            suffix=

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate build summary
        run: |
          echo "## 🏗️ Backend Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-push]
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request_target')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract deploy context
        id: context
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          if [ "$BRANCH" = "main" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "port=8080" >> $GITHUB_OUTPUT
            echo "domain=api.ytclipper.dev" >> $GITHUB_OUTPUT
            echo "compose_dir=/opt/ytclipper" >> $GITHUB_OUTPUT
          else
            safe_branch=$(echo "$BRANCH" | tr '/' '-')
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "port=$((9000 + RANDOM % 1000))" >> $GITHUB_OUTPUT
            echo "domain=$safe_branch.ytclipper.dev" >> $GITHUB_OUTPUT
            echo "compose_dir=/opt/ytclipper-staging/$safe_branch" >> $GITHUB_OUTPUT
            echo "safe_branch=$safe_branch" >> $GITHUB_OUTPUT
          fi

      - name: Create .env file locally
        run: |
          mkdir -p deploy-artifacts
          cp backend/.env.example deploy-artifacts/.env
          echo "BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ steps.context.outputs.safe_branch }}" >> deploy-artifacts/.env
          echo "DB_URL=${{ secrets.DB_URL }}" >> deploy-artifacts/.env
          echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> deploy-artifacts/.env

      - name: Upload files to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker/compose.yml,deploy-artifacts/.env"
          target: "${{ steps.context.outputs.compose_dir }}"

      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ steps.context.outputs.compose_dir }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            docker compose pull
            docker compose up -d
