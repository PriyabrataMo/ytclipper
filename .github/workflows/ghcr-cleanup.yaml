name: GHCR Cleanup

on:
  push:
    branches:
      - "**"
  # schedule:
  #   - cron: "0 2 * * *" # every day at 2 AM UTC
  workflow_dispatch:

jobs:
  cleanup-ghcr:
    name: 🧹 Cleanup GHCR Images
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: 🛂 Authenticate GitHub CLI
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          echo $GHCR_PAT | gh auth login --with-token

      - name: 📦 Cleanup old GHCR versions
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ytclipper/backend
          KEEP: 5
        run: |
          API="https://api.github.com"
          ENCODED_PACKAGE=$(echo $PACKAGE_NAME | sed 's|/|%2F|g')
          PACKAGE_URL="$API/users/$OWNER/packages/container/$ENCODED_PACKAGE/versions"

          echo "Fetching open PR branch names..."
          OPEN_PR_BRANCHES=$(gh pr list --state open --json headRefName -q '.[].headRefName')

          echo "Fetching all versions..."
          VERSIONS=$(curl -s -H "Authorization: Bearer $GHCR_PAT" \
                          -H "Accept: application/vnd.github+json" \
                          "$PACKAGE_URL")

          echo "$VERSIONS" | jq -c '.[]' | while read -r version; do
            ID=$(echo "$version" | jq '.id')
            TAGS=$(echo "$version" | jq -r '.metadata.container.tags[]')

            DELETE=true

            for TAG in $TAGS; do
              if [[ "$TAG" == "main" || "$TAG" == "staging" ]]; then
                DELETE=false
              fi

              for pr_branch in $OPEN_PR_BRANCHES; do
                if [[ "$TAG" == "$pr_branch" ]]; then
                  DELETE=false
                fi
              done
            done

            if [ "$DELETE" = true ]; then
              echo "🗑️ Deleting version $ID (tags: $TAGS)"
              curl -s -X DELETE \
                -H "Authorization: Bearer $GHCR_PAT" \
                -H "Accept: application/vnd.github+json" \
                "$API/users/$OWNER/packages/container/$ENCODED_PACKAGE/versions/$ID"
            else
              echo "⏭️ Skipping version $ID (tags: $TAGS)"
            fi
          done

          echo "✅ Cleanup complete!"
